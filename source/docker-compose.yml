services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: inspire-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # 127.0.0.1, not localhost: the server binds IPv4 only (the container has no
      # IPv6, so the config's `<listen_host>::</listen_host>` never materializes),
      # while `localhost` resolves to ::1 first via Docker's /etc/hosts. busybox wget
      # does not fall back to IPv4, so the check failed against a healthy server —
      # leaving the container permanently `unhealthy` and breaking `up --wait`.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 20
